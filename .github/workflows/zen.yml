name: Latest Zenn Articles

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme-with-zenn:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update README from Zenn RSS
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://zenn.dev/josh/feed"
          max_post_count: 5
          template: "$newline- [$title]($url)"